<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раздел в разработке | Heroes of Newerth</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            animation: fadeInUp 0.8s ease;
        }
        
        .icon {
            font-size: 100px;
            color: #b77fb6;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 3em;
            color: #b77fb6;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(183, 127, 182, 0.5);
        }
        
        .message {
            font-size: 1.3em;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 30px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 65%;
            height: 100%;
            background: linear-gradient(90deg, #b77fb6, #ff69b4);
            border-radius: 10px;
            animation: loading 2s ease-in-out infinite;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #b77fb6;
            text-decoration: none;
            font-size: 1.1em;
            padding: 12px 30px;
            border: 2px solid #b77fb6;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: #b77fb6;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(183, 127, 182, 0.4);
        }
        
        .back-link i {
            margin-right: 8px;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .feature {
            text-align: center;
            color: #888;
        }
        
        .feature i {
            font-size: 24px;
            color: #b77fb6;
            margin-bottom: 8px;
        }
        
        .feature p {
            font-size: 0.85em;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 0 rgba(183, 127, 182, 0.7);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 20px rgba(183, 127, 182, 0.5);
            }
        }
        
        @keyframes loading {
            0% {
                width: 45%;
                opacity: 0.7;
            }
            50% {
                width: 75%;
                opacity: 1;
            }
            100% {
                width: 45%;
                opacity: 0.7;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            .message {
                font-size: 1.1em;
            }
            
            .icon {
                font-size: 70px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8em;
            }
            
            .message {
                font-size: 1em;
            }
            
            .features {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <i class="fas fa-hard-hat"></i>
        </div>
        
        <h1>Раздел в разработке</h1>
        
        <div class="message">
            <i class="fas fa-tools"></i> Этот раздел находится в стадии активной разработки<br>
            Скоро здесь появится много полезной информации!
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <a href="heroes-of-newerth.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Вернуться на главную
        </a>
        
        <div class="features">
            <div class="feature">
                <i class="fas fa-code"></i>
                <p>В разработке</p>
            </div>
            <div class="feature">
                <i class="fas fa-star"></i>
                <p>Скоро будет</p>
            </div>
            <div class="feature">
                <i class="fas fa-gem"></i>
                <p>Ожидайте</p>
            </div>
        </div>
    </div>
</body>
</html>
