<script>
    // База данных терминов на русском языке
    const termsData = [
        // Геймплей
        { term: "Ластхит", definition: "Последний удар по крипу или герою, который приносит золото и опыт. Критически важный навык для фарма.", example: "Практикуйте ластхит, чтобы получать максимум золота на линии." },
        { term: "Денай", definition: "Убийство своего союзного крипа или героя, чтобы противник не получил опыт и золото.", example: "Денай помогает контролировать линию и лишать опыта противника." },
        { term: "Ганк", definition: "Внезапная атака на противника с целью убийства, обычно с участием нескольких героев.", example: "Роумер отправился на ганк на среднюю линию." },
        { term: "Пуллинг", definition: "Привлечение нейтральных крипов к линии, чтобы отвлечь вражеских крипов и контролировать позицию линии.", example: "Саппорт делает пуллинг, чтобы помочь керри безопасно фармить." },
        { term: "Стакинг", definition: "Накопление нейтральных крипов в лагере для более эффективного фарма.", example: "Стакните лагерь в 53 секунды, чтобы потом быстро его очистить." },
        { term: "Вардинг", definition: "Установка вардов (стражей) для обзора карты и контроля ключевых точек.", example: "Хороший саппорт всегда занимается вардингом." },
        { term: "Смок", definition: "Использование дым-варда для скрытного перемещения по карте без обнаружения вардами.", example: "Смок-ганк позволил незаметно подкрасться к врагу." },
        { term: "Роша", definition: "Самый сильный нейтральный монстр на карте, убийство которого дает Эгиду (возрождение).", example: "Команда собралась на Рошана, чтобы получить Эгиду." },
        
        // Роли
        { term: "Керри", definition: "Герой, который нуждается в большом количестве золота и опыта, чтобы стать сильным в поздней игре.", example: "Керри фармит на линии, пока саппорты его защищают." },
        { term: "Саппорт", definition: "Герой, который помогает команде вардами, исцелением, контролем и не требует много золота.", example: "Саппорт купил варды и курицу для команды." },
        { term: "Оффлайнер", definition: "Герой, играющий на сложной линии (оффлейн), часто с высокой живучестью.", example: "Оффлайнер держит линию, пока саппорт роумит." },
        { term: "Мидер", definition: "Герой, играющий на центральной линии, часто с высоким потенциалом ганков.", example: "Мидер контролирует руны и помогает другим линиям." },
        { term: "Роумер", definition: "Герой, который активно перемещается по карте и помогает другим линиям.", example: "Роумер постоянно создаёт давление на карте." },
        { term: "Инициатор", definition: "Герой, который начинает командный бой, используя массовый контроль.", example: "Инициатор прыгнул в толпу и использовал ульту." },
        
        // Предметы
        { term: "Сапоги", definition: "Базовый предмет, увеличивающий скорость передвижения. Существует множество улучшений.", example: "Большинство героев покупают ботинки в начале игры." },
        { term: "БКБ", definition: "Black King Bar - предмет, дающий иммунитет к магии на время.", example: "Керри купил БКБ, чтобы не получить контроль от вражеских магов." },
        { term: "Блинк", definition: "Предмет, позволяющий мгновенно телепортироваться на небольшое расстояние.", example: "Инициаторы часто покупают блинк для неожиданных атак." },
        { term: "Эгида", definition: "Артефакт, дающий возможность возродиться после смерти. Выпадает с Рошана.", example: "Керри взял Эгиду и пошёл пушить." },
        { term: "Курьер", definition: "Курьер, который доставляет предметы героям на линии.", example: "Не забудьте купить курьера в начале игры." },
        { term: "ТП-скролл", definition: "Свиток телепортации, позволяющий переместиться к союзной постройке.", example: "Всегда носите с собой свиток телепортации." },
        
        // Стратегии
        { term: "Пуш", definition: "Атака на вражеские башни с целью их разрушения.", example: "После убийства врагов команда пошла на пуш." },
        { term: "Сплит-пуш", definition: "Стратегия, когда один герой пушит одну линию, пока остальные отвлекают внимание.", example: "Сплит-пуш заставляет врагов разрываться между линиями." },
        { term: "Фарм", definition: "Процесс накопления золота и опыта на нейтральных крипах и линиях.", example: "Керри занят фармом, пока команда контролирует карту." },
        { term: "Командный бой", definition: "Командный бой, в котором участвуют большинство героев обеих команд.", example: "Командный бой решит исход игры." },
        
        // Дополнительные термины
        { term: "ММР", definition: "Matchmaking Rating - рейтинг игрока, используемый для подбора соперников.", example: "Мой ММР вырос после серии побед." },
        { term: "Линия", definition: "Одна из трёх дорог на карте, по которой идут крипы и сражаются герои.", example: "Выберите удобную линию для вашего героя." },
        { term: "Крипы", definition: "Нейтральные или вражеские юниты, которых убивают для получения золота и опыта.", example: "Убивайте крипов, чтобы фармить золото." },
        { term: "Башня", definition: "Оборонительное сооружение, атакующее вражеских героев и крипов.", example: "Не атакуйте героя под башней - она наносит большой урон." },
        { term: "Бараки", definition: "Здания на базе, разрушение которых усиливает крипов на соответствующей линии.", example: "Снесли бараки - теперь крипы станут сильнее." },
        { term: "Ульта", definition: "Ультимейт - самое сильное способность героя, обычно с большим временем восстановления.", example: "Используйте ульту в командном бою." },
        { term: "Фид", definition: "Преднамеренная или непреднамеренная смерть героя, дающая преимущество врагам.", example: "Старайтесь не фидить, чтобы не усиливать противника." },
        { term: "Сноуболл", definition: "Эффект снежного кома - когда один герой или команда получает преимущество и наращивает его.", example: "После нескольких убийств команда начала сноуболлиться." }
    ];
    
    let currentLetter = "";
    
    // Генерация алфавита
    function generateAlphabet() {
        // Получаем все первые буквы терминов
        const letters = [...new Set(termsData.map(term => term.term[0].toUpperCase()))].sort();
        
        const container = document.getElementById("alphabet");
        container.innerHTML = '<div class="alpha-btn" data-letter="all">Все</div>';
        
        for (let char of letters) {
            container.innerHTML += `<div class="alpha-btn" data-letter="${char}">${char}</div>`;
        }
        
        // Добавляем обработчики
        document.querySelectorAll(".alpha-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".alpha-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentLetter = btn.dataset.letter === "all" ? "" : btn.dataset.letter;
                renderGlossary();
            });
        });
    }
    
    // Рендеринг глоссария
    function renderGlossary() {
        // Фильтрация по букве
        let filtered = termsData;
        if (currentLetter) {
            filtered = termsData.filter(term => term.term[0].toUpperCase() === currentLetter);
        }
        
        const container = document.getElementById("glossaryContainer");
        const stats = document.getElementById("stats");
        
        if (filtered.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 50px; color: #b77fb6;">
                    <i class="fas fa-search" style="font-size: 3em; margin-bottom: 15px;"></i>
                    <p>Нет терминов на эту букву</p>
                </div>
            `;
            stats.innerHTML = `📚 Найдено: 0 терминов из ${termsData.length}`;
            return;
        }
        
        // Группировка по первой букве
        const grouped = {};
        filtered.forEach(term => {
            const firstLetter = term.term[0].toUpperCase();
            if (!grouped[firstLetter]) grouped[firstLetter] = [];
            grouped[firstLetter].push(term);
        });
        
        // Сортируем буквы
        const sortedLetters = Object.keys(grouped).sort();
        
        let html = "";
        sortedLetters.forEach(letter => {
            html += `<div class="letter-divider"><i class="fas fa-star-of-life"></i> ${letter}</div>`;
            grouped[letter].forEach(term => {
                html += `
                    <div class="term-card" itemscope itemtype="https://schema.org/DefinedTerm">
                        <div class="term-name" itemprop="name">${term.term}</div>
                        <div class="term-definition" itemprop="description">${term.definition}</div>
                        ${term.example ? `<div class="term-example"><i class="fas fa-lightbulb"></i> ${term.example}</div>` : ""}
                    </div>
                `;
            });
        });
        
        container.innerHTML = html;
        stats.innerHTML = `📚 Всего терминов: ${termsData.length} | Показано: ${filtered.length} | Обновлено: март 2026`;
    }
    
    // Инициализация
    generateAlphabet();
    renderGlossary();

    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
        if (window.pageYOffset > 300) {
            backToTop.classList.add('show');
        } else {
            backToTop.classList.remove('show');
        }
    });
    backToTop.addEventListener('click', () => {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
</script>
</body>
</html>
